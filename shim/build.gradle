plugins {
    id('java-library')
    id('net.neoforged.moddev')
}

//Fabric-only implementation of the subset of NeoForge APIs that Mekanism's shared code uses.
// Most classes are copied (and where necessary adapted) from NeoForge, and are licensed under the LGPL-2.1-only
// (see LICENSE-NeoForge.txt). This project only compiles against vanilla Minecraft; anything that needs to call into
// Fabric goes through the service interfaces in net.neoforged.neoforge.shim, which are implemented by :fabric.
// On NeoForge, the real NeoForge classes are used instead and this project is not included.

group = 'mekanism'
base.archivesName = 'Mekanism-neoforge-shim'
version = "${minecraft_version}-${mod_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fuzs Mod Resources'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter {
            includeGroup('fuzs.forgeconfigapiport')
        }
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroup('net.neoforged')
        }
    }
}

neoForge {
    neoFormVersion = neo_form_version
    //The copied NeoForge code relies on NeoForge's access transformers
    accessTransformers.from(
            'src/main/resources/META-INF/shim-accesstransformer.cfg',
            'src/main/resources/META-INF/neoforge-accesstransformer.cfg',
            'src/main/resources/META-INF/neoforge-accesstransformergenerated.cfg'
    )
    interfaceInjectionData.from('src/main/resources/META-INF/shim-injected-interfaces.json')
}

dependencies {
    //The NeoForge event bus is a standalone library, so we can just use it directly on Fabric as well
    api('net.neoforged:bus:8.0.5') {
        exclude(group: 'org.ow2.asm')
        exclude(group: 'org.apache.logging.log4j')
    }
    //NeoForge's config API is provided on Fabric by Forge Config API Port (https://github.com/Fuzss/forgeconfigapiport)
    compileOnlyApi("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}") {
        transitive = false
    }
    compileOnlyApi('com.electronwill.night-config:core:3.8.4')
    compileOnlyApi('com.electronwill.night-config:toml:3.8.4')
    //Used by FML's APIs; ASM is provided by the loader at runtime
    compileOnlyApi('org.ow2.asm:asm:9.8')
    api('org.apache.maven:maven-artifact:3.9.11')
    compileOnly('org.jspecify:jspecify:1.0.0')
    compileOnly('org.jetbrains:annotations:26.0.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xmaxerrs', '2000'])
}

tasks.withType(Jar).configureEach {
    from('LICENSE-NeoForge.txt')
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
