plugins {
    id('java-library')
    id('net.neoforged.moddev')
}

//Fabric-only implementation of the subset of NeoForge APIs that Mekanism's shared code uses.
// Most classes are copied (and where necessary adapted) from NeoForge, and are licensed under the LGPL-2.1-only
// (see LICENSE-NeoForge.txt). This project only compiles against vanilla Minecraft; anything that needs to call into
// Fabric goes through the service interfaces in net.neoforged.neoforge.shim, which are implemented by :fabric.
// On NeoForge, the real NeoForge classes are used instead and this project is not included.

group = 'mekanism'
base.archivesName = 'Mekanism-neoforge-shim'
version = "${minecraft_version}-${mod_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroup('net.neoforged')
        }
    }
}

neoForge {
    neoFormVersion = neo_form_version
    accessTransformers.from('src/main/resources/META-INF/shim-accesstransformer.cfg')
    interfaceInjectionData.from('src/main/resources/META-INF/shim-injected-interfaces.json')
}

dependencies {
    //The NeoForge event bus is a standalone library, so we can just use it directly on Fabric as well
    api('net.neoforged:bus:8.0.5') {
        exclude(group: 'org.ow2.asm')
        exclude(group: 'org.apache.logging.log4j')
    }
    compileOnly('org.jspecify:jspecify:1.0.0')
    compileOnly('org.jetbrains:annotations:26.0.2')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xmaxerrs', '2000'])
}

tasks.withType(Jar).configureEach {
    from('LICENSE-NeoForge.txt')
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
