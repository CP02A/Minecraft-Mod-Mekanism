pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id('org.gradle.toolchains.foojay-resolver-convention') version('1.0.0')
}

include('annotation-processor')
//Multiloader layout: the shared sources and resources live in common/src (not a project of its own) and are compiled by each of the
// loader specific projects (see docs/multiloader.md)
//Fabric implementation of the subset of NeoForge APIs used by the shared code
include('shim')
include('neoforge')
include('fabric')
