plugins {
    id('java')
    id('idea')
    id('net.fabricmc.fabric-loom')
}

//Fabric version of Mekanism. The shared code in common/src is written against NeoForge's API (see :shim), and is compiled here as well
// (see docs/multiloader.md). Classes that need a loader specific implementation exist with the same name in neoforge/src and fabric/src
def commonSrc = rootProject.file('common/src')

//The shared sources are copied into the build directory instead of being added as source directories, as IntelliJ doesn't allow the same
// directory to be a content root of both the :neoforge and the :fabric modules
def syncSharedSources = tasks.register('syncSharedSources', Sync) {
    from(new File(commonSrc, 'api/java'))
    from(new File(commonSrc, 'main/java'))
    into(layout.buildDirectory.dir('generated/sharedSources'))
}

sourceSets {
    main {
        java {
            srcDir(syncSharedSources)
        }
    }
    //Fabric specific game tests (run by runGameTestServer)
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

//Secondary modules, separate mods like on NeoForge. Each gets its own source set compiled from common/src/<module> (plus Fabric specific
// sources and resources in src/<module>) and its own jar
def secondaryModules = ['additions', 'generators', 'tools']
for (String name : secondaryModules) {
    def module = name
    def syncModuleSources = tasks.register("sync${module.capitalize()}Sources", Sync) {
        from(new File(commonSrc, "${module}/java"))
        into(layout.buildDirectory.dir("generated/${module}Sources"))
    }
    def moduleSourceSet = sourceSets.create(module) {
        java {
            srcDir(syncModuleSources)
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    sourceSets.gametest.compileClasspath += moduleSourceSet.output
    sourceSets.gametest.runtimeClasspath += moduleSourceSet.output
}
//Load the modules in the client and server runs (which use the main source set's runtime classpath) as well
for (String name : secondaryModules) {
    sourceSets.main.runtimeClasspath += sourceSets.named(name).get().output
}

//Block/entity info overlay integrations (Jade, The One Probe, WTHIT). Compiled from the NeoForge integration sources
// (neoforge/src/integration/<name>, minus NeoForge only classes) plus Fabric specific sources in src/integration/<name>, and packaged in the
// main jar. Their classes are only loaded by the mods' own plugin entrypoints (fabric.mod.json, wthit_plugins.json), so Mekanism runs without them
def overlayIntegrations = [
        'jade'        : [],
        'the_one_probe': ['**/MekanismTOPIntegration.java'],//NeoForge IMC registration, replaced by the theoneprobe entrypoint
        'wthit'       : []
]
def overlaySourceSets = []
for (def entry : overlayIntegrations) {
    def path = entry.key
    def excludes = entry.value
    def baseName = path.split('_').collect { it.capitalize() }.join('')
    def syncIntegrationSources = tasks.register("sync${baseName}IntegrationSources", Sync) {
        from(rootProject.file("neoforge/src/integration/${path}/java")) {
            exclude(excludes)
        }
        into(layout.buildDirectory.dir("generated/integration${baseName}Sources"))
    }
    def integrationSourceSet = sourceSets.create("integration${baseName}") {
        java {
            srcDir(syncIntegrationSources)
            srcDir("src/integration/${path}/java")
        }
        resources {
            srcDir(rootProject.file("neoforge/src/integration/${path}/resources"))
            srcDir("src/integration/${path}/resources")
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    overlaySourceSets.add(integrationSourceSet)
    //Only reference the resources output when there are resources, as Fabric Loader warns about missing class path entries
    def hasResources = rootProject.file("neoforge/src/integration/${path}/resources").exists() || file("src/integration/${path}/resources").exists()
    def integrationOutput = hasResources ? integrationSourceSet.output : integrationSourceSet.output.classesDirs
    sourceSets.main.runtimeClasspath += integrationOutput
    sourceSets.gametest.compileClasspath += integrationSourceSet.output + integrationSourceSet.compileClasspath
    sourceSets.gametest.runtimeClasspath += integrationOutput
    tasks.named('jar', Jar) { from(integrationSourceSet.output) }
}

group = 'mekanism'
def basicVersion = "${mod_version}." + (System.getenv('BUILD_NUMBER') ?: 'homebaked')
version = "${minecraft_version}-${basicVersion}"
base.archivesName = 'Mekanism-fabric'

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
    withSourcesJar()
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter {
            includeGroup('mezz.jei')
            includeGroup('org.openzen.zencode')
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://repo.sleeping.town/' } }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.neoforged.net/releases' } }
        filter { includeModule('net.neoforged', 'bus') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.neoforged.net/mojang-meta' } }
        filter { includeModule('net.neoforged', 'minecraft-dependencies') }
    }
    //Block/entity info overlay mods (Jade, The One Probe, WTHIT and its Bad Packets dependency)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

//Block/entity info overlay integrations: compiled against the mods, and loaded in the dev runs and game tests
dependencies {
    integrationJadeCompileOnly("maven.modrinth:jade:${jade_fabric_version}")
    integrationTheOneProbeCompileOnly("maven.modrinth:the-one-probe:${top_fabric_version}")
    integrationWthitCompileOnly("maven.modrinth:wthit:${wthit_fabric_version}")
    localRuntime("maven.modrinth:jade:${jade_fabric_version}")
    localRuntime("maven.modrinth:the-one-probe:${top_fabric_version}")
    localRuntime("maven.modrinth:wthit:${wthit_fabric_version}")
    localRuntime("maven.modrinth:badpackets:${badpackets_fabric_version}")
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    compileOnly('org.jspecify:jspecify:1.0.0')
    compileOnly('com.google.errorprone:error_prone_annotations:2.36.0')
    compileOnly('org.jetbrains:annotations:26.0.2')
    compileOnly(project(':annotation-processor'))
    annotationProcessor(project(':annotation-processor'))
    //The API exposes helpers for recipe viewer integrations
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api") {
        transitive = false
    }

    //Fabric implementation of the subset of NeoForge's API the shared code uses, bundled (with its dependencies) as nested jars
    implementation(project(':shim')) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    include(project(':shim')) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    include('net.neoforged:bus:8.0.5')
    include('net.jodah:typetools:0.6.3')
    include('org.apache.maven:maven-artifact:3.9.11')
    //NeoForge's config API on Fabric
    implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")
    include("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")
    //Energy interop with other Fabric mods
    implementation("teamreborn:energy:${team_reborn_energy_version}") {
        transitive = false
    }
    include("teamreborn:energy:${team_reborn_energy_version}")
}

loom {
    //Generated from the access transformers by gen_fabric_glue.py
    accessWidenerPath = file('src/main/resources/mekanism.accesswidener')
    mods {
        register('mekanism') {
            sourceSet(sourceSets.main)
            //Block/entity info overlay integrations
            overlaySourceSets.each { sourceSet(it) }
        }
        for (String name : secondaryModules) {
            //Note: Copy the loop variable, as the closure is evaluated lazily
            def module = name
            register("mekanism${module}") {
                sourceSet(sourceSets.named(module).get())
            }
        }
        register('mekanism_fabric_tests') {
            sourceSet(sourceSets.gametest)
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        //Starts a game test server (which loads a temporary world and exits once all game tests have run), useful as a smoke test
        gameTestServer {
            server()
            setConfigName('Fabric Game Test Server')
            ideConfigGenerated(false)
            runDir('runs/gametest')
            source(sourceSets.gametest)
            vmArg('-Dfabric-api.gametest')
            vmArg("-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest/report.xml').get().asFile}")
        }
        //Starts a client, runs the client game tests (which load a world and take screenshots) and exits
        gameTestClient {
            client()
            setConfigName('Fabric Game Test Client')
            ideConfigGenerated(false)
            runDir('runs/gametestclient')
            source(sourceSets.gametest)
            vmArg('-Dfabric.client.gametest')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-AmekanismModule=mekanism', '-Xmaxerrs', '20000'])
}

tasks.named('compileGametestJava', JavaCompile, {
    options.compilerArgs.remove('-AmekanismModule=mekanism')
})

tasks.named('processResources', ProcessResources, {
    //Shared resources, and the generated data
    from(new File(commonSrc, 'main/resources'))
    from(new File(commonSrc, 'datagen/generated/mekanism')) {
        exclude('.cache/**', 'pack.mcmeta', '*-compat/**')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def expandProps = ['version'                    : version,
                       'minecraft_version_range'    : minecraft_version_range,
                       'fabric_loader_version_range': fabric_loader_version_range,
                       'java_version'               : java_version]
    inputs.properties(expandProps)
    //Plain token replacement, as the injected interfaces contain nested class names ($) that would break template expansion
    filesMatching('fabric.mod.json') {
        filter { String line -> expandProps.inject(line) { String l, key, value -> l.replace('${' + key + '}', value.toString()) } }
    }
})

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_Mekanism" }
    }
}

for (String name : secondaryModules) {
    def module = name
    def moduleSourceSet = sourceSets.named(module).get()
    tasks.named(moduleSourceSet.compileJavaTaskName, JavaCompile, {
        options.annotationProcessorPath = configurations.annotationProcessor
        options.compilerArgs.remove('-AmekanismModule=mekanism')
        options.compilerArgs.add("-AmekanismModule=mekanism${module}".toString())
    })
    tasks.named(moduleSourceSet.processResourcesTaskName, ProcessResources, {
        from(new File(commonSrc, "${module}/resources"))
        from(new File(commonSrc, "datagen/generated/mekanism${module}")) {
            exclude('.cache/**', 'pack.mcmeta', '*-compat/**')
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        def expandProps = ['version'                    : version,
                           'minecraft_version_range'    : minecraft_version_range,
                           'fabric_loader_version_range': fabric_loader_version_range,
                           'java_version'               : java_version]
        inputs.properties(expandProps)
        filesMatching('fabric.mod.json') {
            filter { String line -> expandProps.inject(line) { String l, key, value -> l.replace('${' + key + '}', value.toString()) } }
        }
    })
    def moduleJar = tasks.register("${module}Jar", Jar) {
        group = 'build'
        archiveBaseName = "Mekanism${module.capitalize()}-fabric"
        from(moduleSourceSet.output)
    }
    tasks.named('assemble') { dependsOn(moduleJar) }
}

idea {
    module {
        excludeDirs.add(file('runs'))
    }
}

//Finds injected default methods (shim vs shim, Fabric API, other mods and vanilla) that conflict at runtime (IncompatibleClassChangeError), taking
// the mixins of Mekanism and the mods on the classpath into account. Needs Python 3 (python on the path, or the PYTHON environment variable)
def checkInjectedInterfaces = tasks.register('checkInjectedInterfaces', Exec) {
    group = 'verification'
    description = 'Checks injected interfaces for conflicting default methods'
    def shimClasses = project(':shim').sourceSets.main.output.classesDirs
    def mainClasses = sourceSets.main.output.classesDirs
    def mixinConfigs = fileTree('src/main/resources') { include('*.mixins.json') }
    def classpath = sourceSets.main.compileClasspath
    def script = file('check_injected_interfaces.py')
    def marker = layout.buildDirectory.file('checkInjectedInterfaces.txt')
    def argFileProvider = layout.buildDirectory.file('checkInjectedInterfaces.args')
    dependsOn(project(':shim').tasks.named('classes'), tasks.named('classes'))
    inputs.files(shimClasses, mainClasses, mixinConfigs, script, rootProject.file('shim/src/main/resources/META-INF/shim-injected-interfaces.json'))
    inputs.files(classpath).withNormalizer(ClasspathNormalizer)
    outputs.file(marker)
    executable = System.getenv('PYTHON') ?: 'python'
    doFirst {
        def jars = classpath.files.findAll { it.exists() }
        def minecraft = jars.find { it.name.startsWith('minecraft-') && it.name.contains('merged') }
        if (minecraft == null) {
            throw new GradleException("Couldn't find the merged Minecraft jar on the compile classpath")
        }
        def arguments = []
        mixinConfigs.each { arguments.addAll(['--mixin-config', it.absolutePath]) }
        mainClasses.each { arguments.addAll(['--mixin-classes', it.absolutePath]) }
        arguments.add(minecraft.absolutePath)
        arguments.add(shimClasses.singleFile.absolutePath)
        arguments.addAll((jars - minecraft).collect { it.absolutePath })
        //Passed in a file, as the classpath can exceed Windows' command line length limit
        def argFile = argFileProvider.get().asFile
        argFile.parentFile.mkdirs()
        argFile.text = arguments.join('\n') + '\n'
        args(script.absolutePath, '@' + argFile.absolutePath)
    }
    doLast {
        marker.get().asFile.text = 'No conflicting injected default methods\n'
    }
}
tasks.named('check') { dependsOn(checkInjectedInterfaces) }

//------------------------------------------------------------------------------------------------------------------------------------------------------
//JEI integration. Compiled from common/src/integration/jei/<module>/java (shared with :neoforge) plus the Fabric specific sources in src/jei/java (loader
// specific classes with the same name as in neoforge/src/integration/jei, e.g. JeiFluidHelper) into one source set per module, which is packaged into
// that module's jar and registered through the jei_mod_plugin entrypoints of its fabric.mod.json, so it is only loaded when JEI is present.
// JEI itself is only added to the client runs (through fabric.addMods), the servers run without it
def jeiCompileConfig = configurations.create('jeiCompile') {
    canBeConsumed = false
}
def jeiRuntimeConfig = configurations.create('jeiRuntime') {
    canBeConsumed = false
    transitive = false
}
dependencies {
    jeiCompile("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}") {
        transitive = false
    }
    //The Fabric jar contains all of JEI (and its config library as a nested jar)
    jeiRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
}
def jeiSourceSets = [:]
for (String name : ['main'] + secondaryModules) {
    def module = name
    def setName = module == 'main' ? 'jei' : "${module}Jei"
    def syncJeiSources = tasks.register("sync${setName.capitalize()}Sources", Sync) {
        from(new File(commonSrc, "integration/jei/${module}/java"))
        into(layout.buildDirectory.dir("generated/${setName}Sources"))
    }
    def jeiSourceSet = sourceSets.create(setName) {
        java {
            srcDir(syncJeiSources)
        }
        resources {
            srcDir(new File(commonSrc, "integration/jei/${module}/resources"))
        }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + jeiCompileConfig
        if (module != 'main') {
            compileClasspath += sourceSets.named(module).get().output + jeiSourceSets['main'].output
        }
    }
    jeiSourceSets[module] = jeiSourceSet
    //Loaded in all runs (like in the jars), and visible to the game tests. Only the main one has resources (Fabric Loader warns about missing class
    // path entries)
    def jeiOutput = module == 'main' ? jeiSourceSet.output : jeiSourceSet.output.classesDirs
    sourceSets.main.runtimeClasspath += jeiOutput
    sourceSets.gametest.compileClasspath += jeiSourceSet.output
    sourceSets.gametest.runtimeClasspath += jeiOutput
    loom.mods.named(module == 'main' ? 'mekanism' : "mekanism${module}") {
        sourceSet(jeiSourceSet)
    }
    tasks.named(module == 'main' ? 'jar' : "${module}Jar", Jar) {
        from(jeiSourceSet.output)
    }
}
sourceSets.gametest.compileClasspath += jeiCompileConfig
for (String name : ['client', 'gameTestClient']) {
    loom.runs.named(name) {
        vmArg("-Dfabric.addMods=${jeiRuntimeConfig.singleFile.absolutePath}")
    }
}
