plugins {
    id('java-library')
    id('net.neoforged.moddev')
}

//Loader agnostic Mekanism code. This project only compiles against vanilla Minecraft (via NeoForm), and its sources
// and resources get compiled directly into each of the loader specific projects (:neoforge and :fabric).
// Anything in here must not reference NeoForge or Fabric classes; instead access loader specific functionality
// through the services in mekanism.common.platform.services (see mekanism.common.platform.Services)

group = 'mekanism'
base.archivesName = 'Mekanism-common'

java {
    toolchain.languageVersion = JavaLanguageVersion.of("${java_version}")
}

neoForge {
    enable {
        neoFormVersion = neo_form_version
        enabledSourceSets = sourceSets
    }
    //Shared code is written against NeoForge, so apply the same access transformers NeoForge and Mekanism use,
    // and inject the shim's subset of NeoForge's extension interfaces into vanilla classes
    accessTransformers.from(
            rootProject.file('shim/src/main/resources/META-INF/shim-accesstransformer.cfg'),
            rootProject.file('shim/src/main/resources/META-INF/neoforge-accesstransformer.cfg'),
            rootProject.file('shim/src/main/resources/META-INF/neoforge-accesstransformergenerated.cfg'),
            rootProject.file('neoforge/src/main/resources/META-INF/accesstransformer.cfg')
    )
    interfaceInjectionData.from(rootProject.file('shim/src/main/resources/META-INF/shim-injected-interfaces.json'))
}

dependencies {
    compileOnly('org.jspecify:jspecify:1.0.0')
    //Shared code is written against NeoForge's API; on Fabric the shim provides the parts of it that are used
    compileOnly(project(':shim')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(sourceSets.main.java.sourceDirectories.singleFile)
    commonResources(sourceSets.main.resources.sourceDirectories.singleFile)
}

//Mark the variants as being for the "common" loader, so that the loader projects can depend on this project without
// Gradle getting confused between this and the loader specific Minecraft artifacts
// (mcgradleconventions loader attribute, as used by the MultiLoader-Template)
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://repo.sleeping.town/' } }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } }
        filter { includeGroup('fuzs.forgeconfigapiport') }
    }
}

//TEMP (porting): compile the NeoForge API sources against vanilla + the shim to find what is still missing
sourceSets {
    apiCheck {
        java.srcDirs = [rootProject.file('neoforge/src/api/java')]
        //Datagen only runs on NeoForge, and recipe viewer integrations are handled separately
        java.exclude('mekanism/api/datagen/**')
        resources.srcDirs = []
        compileClasspath += sourceSets.main.compileClasspath
    }
    mainCheck {
        java.srcDirs = [rootProject.file('neoforge/src/main/java'), file('src/main/java')]
        //NeoForge specific implementations of the platform services
        java.exclude('mekanism/common/platform/neoforge/**', 'mekanism/client/platform/neoforge/**')
        resources.srcDirs = []
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.apiCheck.output + sourceSets.apiCheck.compileClasspath
    }
}
dependencies {
    apiCheckCompileOnly(project(':shim')) {
        attributes {
            attribute(Attribute.of('io.github.mcgradleconventions.loader', String), 'common')
        }
    }
    apiCheckCompileOnly('org.jspecify:jspecify:1.0.0')
    apiCheckCompileOnly('com.google.errorprone:error_prone_annotations:2.36.0')
    //The API exposes helpers for recipe viewer integrations
    apiCheckCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    apiCheckCompileOnly("dev.emi:emi-neoforge:${emi_version}:api") {
        transitive = false
    }
    apiCheckCompileOnly('org.jetbrains:annotations:26.0.2')
}
tasks.named('compileApiCheckJava', JavaCompile) {
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}
tasks.named('compileMainCheckJava', JavaCompile) {
    options.compilerArgs.addAll(['-Xmaxerrs', '20000'])
}
