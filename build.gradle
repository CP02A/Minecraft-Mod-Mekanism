import org.gradle.buildconfiguration.tasks.UpdateDaemonJvm

plugins {
    //Declare plugin versions in one place so that the subprojects share a single classloader for them
    id('net.neoforged.moddev').version('2.0.148').apply(false)//https://projects.neoforged.net/neoforged/moddevgradle
    id('net.fabricmc.fabric-loom').version("${loom_version}").apply(false)//https://fabricmc.net/develop
    id('net.darkhax.curseforgegradle').version('1.3.33').apply(false)
    id('com.modrinth.minotaur').version('2.10.0').apply(false)
}

tasks.named('wrapper', Wrapper, {
    //Define wrapper values here so as to not have to always do so when updating gradlew.properties
    gradleVersion = '9.9.0'
    distributionType = Wrapper.DistributionType.ALL
})

tasks.named('updateDaemonJvm', UpdateDaemonJvm, {
    languageVersion = JavaLanguageVersion.of("${java_version}")
})
