import org.gradle.buildconfiguration.tasks.UpdateDaemonJvm

plugins {
    //Declare plugin versions in one place so that the subprojects share a single classloader for them
    id('net.neoforged.moddev').version('2.0.148').apply(false)//https://projects.neoforged.net/neoforged/moddevgradle
    id('net.fabricmc.fabric-loom').version("${loom_version}").apply(false)//https://fabricmc.net/develop
    id('net.darkhax.curseforgegradle').version('1.3.33').apply(false)
    id('com.modrinth.minotaur').version('2.10.0').apply(false)
    id('com.gradleup.shadow').version('9.6.1').apply(false)//https://github.com/GradleUp/shadow
}

tasks.named('wrapper', Wrapper, {
    //Define wrapper values here so as to not have to always do so when updating gradlew.properties
    gradleVersion = '9.9.0'
    distributionType = Wrapper.DistributionType.ALL
})

tasks.named('updateDaemonJvm', UpdateDaemonJvm, {
    languageVersion = JavaLanguageVersion.of("${java_version}")
})

//Standard commands, the same in all of the ports (see docs/Development.md, "Standard Gradle commands")
tasks.register('uiTest') {
    group = 'standard'
    description = 'Runs all Fabric client game tests (UI tests): opens the game window, which ignores real keyboard/mouse input, never captures the mouse and has no sound'
    dependsOn(':fabric:runGameTestClient')
}

tasks.register('nonUiTest') {
    group = 'standard'
    description = 'Runs all tests that need no window: unit tests, verification checks and the Fabric and NeoForge game test servers (JUnit XML in */build/test-results)'
    dependsOn(':annotation-processor:check', ':shim:check', ':fabric:check', ':neoforge:check', ':fabric:runGameTestServer', ':neoforge:runGameTestServer')
}

tasks.register('buildFabric') {
    group = 'standard'
    description = 'Builds the release Fabric jars into build/dist/fabric'
    dependsOn(':fabric:copyReleaseJars')
}

tasks.register('buildForge') {
    group = 'standard'
    description = 'Builds the release NeoForge jars into build/dist/neoforge'
    dependsOn(':neoforge:copyReleaseJars')
}
